name: CI

# Every push to main and every pull request runs the same gate as `npm run verify` on a developer's machine:
# typecheck, lint, 1000+ unit tests, and a production build. No secrets are needed: without a GEMINI_API_KEY the app
# uses its built-in fallback reader, and the tests mock Gemini.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (exact versions from package-lock.json)
        run: npm ci

      - name: Verify
        run: npm run verify
